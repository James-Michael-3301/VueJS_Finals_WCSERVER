<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
</head>
<body>
    <a href="/profile">Cancel</a>
    <br>
    <a href="/">Back to Home</a>
    <br>
    <h1>Edit Profile</h1>

    <form action="/profile" method="GET">

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" value="Mary Grace Piatos">
        <br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" value="mgpiatos@gmail.com">
        <br><br>

        <label for="course">Course:</label><br>
        <input type="text" id="course" name="course" value="BS Information Technology">
        <br><br>

        <label for="specialization">Specialization:</label><br>
        <input type="text" id="specialization" name="specialization" value="Web Development">
        <br><br>

        <button type="submit">Save Changes</button>

    </form>

</body>
</html>
