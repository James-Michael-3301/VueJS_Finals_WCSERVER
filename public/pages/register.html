<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width='device-width', initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <a href="/">Back to Home</a><br>
    <div>
    <form action="/register" method="POST">
    <h1>Fill out the following</h1>
    <label for="fname"></label>
    <input type="text" placeholder="First Name" name="firstname" id="firstname" required><br>
    <label for="lname"></label>
    <input type="text" placeholder="Last Name" name="lastname" id="lastname" required><br>
    <label for="age"></label>
    <input type="text" placeholder="Age" name="age" id="age" required><br>
    <button type="submit">Submit</button>
    </form>
    </div>
</body>
</html>
